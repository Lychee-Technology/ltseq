[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "py-ltseq"
version = "0.1.0"
description = "LTSeq: High-performance Ordered Sequence Algebra Engine."
authors = [{name = "LTBase Team", email = "info@ltbase.dev"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=25.0.1",
]

[tool.maturin]
# Key setting: place the Rust build artifact under the ltseq package as ltseq_core
module-name = "ltseq.ltseq_core"
features = ["pyo3/extension-module"]
# [Important] Tell pyo3/maturin this is a mixed Python/Rust project
# Without this, maturin may fail to locate the Python source package
python-source = "./py-ltseq"

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=9.1.1",
    "pandas>=3.0.5",
    "ipdb>=0.13.13",  # Helpful for debugging
    "pyright>=1.1.411",
]
bench = [
    "duckdb>=1.5.5",
    "psutil>=7.2.2",
]
autoresearch = [
    "duckdb>=1.5.5",
    "psutil>=7.2.2",
    "py-spy>=0.4.2",
]

[tool.pytest.ini_options]
testpaths = ["py-ltseq/tests"]
pythonpath = ["."] # Ensure tests can find the current directory
