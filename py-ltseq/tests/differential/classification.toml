# Cases whose outcome on this branch is not main's recorded outcome, or
# whose recorded outcome is wrong. A case not listed here is UNCHANGED:
# it must reproduce expected/<module>.jsonl (recorded on main 68d6114).
#
# status:
#   INTENDED_CHANGE  a deliberate behavior change; `expect` is the new outcome
#   BUG_FIXED        main is wrong; `expect` is the right outcome
#   PREEXISTING_BUG  main is wrong and this branch keeps main's outcome; `ref` tracks the fix
#   REGRESSION       never allowed in a merged state
#   UNDECIDED        never allowed in a merged state
# `expect` is the outcome as JSON (see harness.comparable: errors compare
# by class and stage only). `ref` points to the issue, decision or finding.
# No status admits a Rust panic, not even one main recorded.

