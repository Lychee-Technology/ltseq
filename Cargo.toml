[package]
name = "ltseq_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ltseq_core"
crate-type = ["cdylib"]

[dependencies]
# Python co-op
# extension-module is injected by maturin via pyproject.toml [tool.maturin] features;
# keeping it out of the cargo features lets `cargo test` link on Linux (pyo3 FAQ).
pyo3 = { version = "0.29.2", features = ["macros"] }

datafusion = "55.0.0"

# exact rational arithmetic for literal placement
num-bigint = "0.4"
num-traits = "0.2"

# async executor utilities
futures-util = "0.3.34"

# Parallel iteration for sequence engine
rayon = "1.12.0"

# Direct Parquet reading (must match datafusion's arrow version)
parquet = { version = "59.2.0", default-features = false, features = ["arrow"] }

# Arrow C Data Interface bridge to pyarrow (issue #143). Must match
# datafusion's arrow version; `pyarrow` implies `ffi` and pulls in
# arrow-pyarrow, which targets the same pyo3 0.29 line as this crate.
arrow = { version = "59.2.0", default-features = false, features = ["pyarrow"] }

tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }

# Wall-clock ↔ instant conversion for timestamp literals against zoned
# columns. Already in the tree through arrow; the version follows it.
chrono = { version = "0.4.45", default-features = false }

# Writers' temporary files, renamed over the destination on success (#259).
# Already in the tree through DataFusion; the version follows it.
tempfile = "3.27.0"

# The m0 prototypes' query planner (DataFusion's planner traits are async).
# Already in the tree through DataFusion; the version follows it.
async-trait = { version = "0.1.92", optional = true }

# The POSIX ACL of a file a writer replaces (#259). Already in the tree
# through tempfile; the version follows it.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

# The extended ACL of a file a writer replaces, and the fsync fallback for
# filesystems that refuse F_FULLFSYNC (#259). Already in the tree through
# tokio and tempfile; the version follows the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[features]
# Prototypes that price the v0.5 contract's costly commitments (#251).
# Only measurement builds enable it; see benchmarks/m0/README.md.
m0 = ["dep:async-trait", "tokio/sync", "tokio/time"]

# No profile may set `panic = "abort"`: `transpiler::resolve` catches a panic
# in DataFusion's type coercion (#242) and reads it as "no common type".
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

# Profile for flamegraph generation (retains debug symbols)
# Build with: maturin develop --profile flamegraph
# Provides readable Rust function names in py-spy/perf flamegraphs.
[profile.flamegraph]
inherits = "release"
debug = true
strip = "none"
