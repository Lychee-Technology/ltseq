name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # requires-python admits every version from 3.13 up, so the Python suite
    # runs on each supported minor version (#254). The Rust steps do not
    # depend on the Python version, so they run in the first entry only.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    env:
      # uv uses this interpreter for the venv, not another one on the runner.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # pyo3 is built for the interpreter it finds, so each Python version
      # keeps a target directory of its own.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-cargo-

      - name: Run clippy
        if: matrix.python-version == '3.13'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        if: matrix.python-version == '3.13'
        run: cargo test

      # The #251 measurement prototypes (benchmarks/m0) compile only with the
      # m0 feature, which no other step enables. The feature adds no
      # dependency features, so this rebuilds only this crate.
      - name: Run clippy and Rust tests on the m0 prototypes
        if: matrix.python-version == '3.13'
        run: |
          cargo clippy --all-targets --features m0 -- -D warnings
          cargo test --features m0 --lib m0::

      # #256's stream error spike (benchmarks/stream_errors) compiles only
      # with the stream_spike feature. Its Python tests need a spike build
      # and skip on the default one.
      - name: Run clippy and Rust tests on the stream error spike
        if: matrix.python-version == '3.13'
        run: |
          cargo clippy --all-targets --features stream_spike -- -D warnings
          cargo test --features stream_spike --lib stream_spike::

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Build Rust extension
        run: uv run maturin develop

      - name: Run pyright on library
        run: uv run pyright py-ltseq/ltseq

      - name: Run pyright on typecheck tests
        run: uv run pyright py-ltseq/typecheck_tests

      - name: Run tests
        run: uv run pytest py-ltseq/tests/ -v

      - name: Check the tutorial Markdown matches the notebooks
        run: uv run python tutorials/render_markdown.py --check

      - name: Run tutorial notebooks
        run: uv run pytest --nbmake tutorials/ -v

  macos:
    # macOS is supported alongside Linux, and its file semantics differ:
    # extended ACLs, /dev/fd, F_FULLFSYNC, a new file taking its directory's
    # group. This job compiles and lints the macOS-only code, runs the Rust
    # tests, and runs the writer tests, whose only skips may be Linux-only
    # ones. macos-15 is Apple Silicon (arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # The two `lowering_coerces_each_node_once` tests nest expressions 200
      # deep. In a debug build they need between 1.5 and 2 MiB of stack on
      # x86-64 Linux, and overflow the test threads' 2 MiB on arm64 macOS.
      # That predates the macOS job and does not involve the writers (#320).
      - name: Run Rust tests
        run: cargo test -- --skip lowering_coerces_each_node_once

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # Without the project: maturin develop builds the extension below, and
      # installing the project would build it again in release mode.
      - name: Install Python dependencies
        run: uv sync --group dev --no-install-project

      - name: Build Rust extension
        run: uv run --no-sync maturin develop

      - name: Import the package
        run: uv run --no-sync python -c "import ltseq, ltseq.ltseq_core; print(ltseq.__file__)"

      - name: Run writer tests
        run: |
          uv run --no-sync pytest py-ltseq/tests/test_atomic_writers.py -v -rs --junitxml=writers.xml
          uv run --no-sync python - <<'EOF'
          import xml.etree.ElementTree as ET
          skipped = [s.get("message", "") for s in ET.parse("writers.xml").iter("skipped")]
          others = [m for m in skipped if "Linux" not in m]
          assert not others, f"tests skipped on macOS: {others}"
          print(f"{len(skipped)} Linux-only tests skipped")
          EOF

  memory-harness:
    # Peak-memory harness (#274): each run reads an input of ten budgets in a
    # process of its own, so it runs beside the main job, not inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Build Rust extension
        run: uv run maturin develop

      - name: Run memory harness
        run: uv run pytest py-ltseq/tests/memory -m memory -v
