# #411 / R1-F1: the direct DataFusion probe against 55.0.0, LTSeq's shipped
# version. Cargo.lock beside this file pins the resolved graph; build with
# `cargo run --locked -q -- CASES`.
[package]
name = "df411_probe_55"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "df411_probe_55"
path = "../probe.rs"

[dependencies]
datafusion = "=55.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[workspace]
