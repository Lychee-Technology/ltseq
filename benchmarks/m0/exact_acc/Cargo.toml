# m2's exact accumulator (src/m0/exact_acc.rs) as a crate of its own, so its
# reference tests run without building LTSeq. See README.md.
[package]
name = "m0-exact-acc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "../../../src/m0/exact_acc.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
rand = "0.8"
serde_json = "1"

# Release build with overflow checks and debug assertions, for the worst-case
# chunk-overflow test (`cargo test --profile release-checked -- --ignored`).
[profile.release-checked]
inherits = "release"
overflow-checks = true
debug-assertions = true

[workspace]
